name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            app/requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r app/requirements.txt -r requirements-dev.txt

      - name: Run application tests
        run: pytest -q

      - name: Validate Compose configuration
        env:
          GF_SECURITY_ADMIN_PASSWORD: ci-only-placeholder
        run: docker compose config -q

      - name: Build web application image
        run: docker build --tag server-devops-webapp:ci ./app
